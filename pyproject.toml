[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-lipschitz-factor-flows"
version = "0.1.0"
description = "Compact research implementation of Bi-Lipschitz Factor Flows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["bff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

